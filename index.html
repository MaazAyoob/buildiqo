<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>Buildiqo.ai — Civil Construction Cost Estimator &amp; 3D BOQ Platform</title>
    <meta name="description" content="Civil engineering &amp; architectural home construction planning platform with precision IS 456 quantities, top view CAD, and 3D architectural viewer." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Global startup error reporter: catches JS crashes before React mounts and shows them on-screen in all browsers -->
    <script>
      (function() {
        function showErr(msg, src, line) {
          if (document.getElementById('_serr')) return;
          var d = document.createElement('div');
          d.id = '_serr';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;font-family:monospace;box-sizing:border-box';
          d.innerHTML = '<div style="max-width:680px;width:100%"><h2 style="color:#dc2626;font-size:15px;margin:0 0 10px;font-family:sans-serif">&#9888; Buildiqo Startup Error</h2>'
            + '<pre style="background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;padding:14px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:#7f1d1d;max-height:60vh;overflow:auto">'
            + String(msg).replace(/</g,'&lt;')
            + '\n\nSource: ' + String(src)
            + '\nLine: ' + String(line)
            + '</pre>'
            + '<p style="color:#64748b;font-size:10px;margin:8px 0 0;font-family:sans-serif;word-break:break-all">UA: ' + navigator.userAgent + '</p></div>';
          document.body.appendChild(d);
        }
        window.onerror = function(msg, src, line, col, err) {
          showErr((err && err.stack) ? err.stack : msg, src || '(unknown)', line || 0);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          showErr((r && r.stack) ? r.stack : ((r && r.message) ? r.message : String(r)), 'Unhandled Promise', '');
        });
      })();
    </script>
  </head>
  <body class="h-full font-sans antialiased text-slate-900 bg-slate-50 selection:bg-blue-600 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
