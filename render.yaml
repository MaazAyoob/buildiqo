services:
  # Frontend Static Site
  - type: web
    name: buildiqo-ai
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://buildiqo-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Node.js Express Backend Service
  - type: web
    name: buildiqo-ai-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
