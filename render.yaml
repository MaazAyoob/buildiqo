services:
  # Frontend Static Site
  - type: web
    name: buildiqo-ai
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://buildiqo-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Node.js Express Backend Service
  - type: web
    name: buildiqo-ai-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: FLOORPLAN_SERVICE_URL
        value: https://buildiqo-ai-floorplan.onrender.com
      - key: FLOORPLAN_SERVICE_TIMEOUT_MS
        value: 30000
      - key: FLOORPLAN_SERVICE_TOKEN
        sync: false

  # Python FastAPI Floor Plan Extraction Microservice (Phase 1)
  - type: web
    name: buildiqo-ai-floorplan
    runtime: python
    plan: free
    rootDir: floorplan-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: FLOORPLAN_SERVICE_TOKEN
        sync: false
      - key: ODA_FILE_CONVERTER_PATH
        sync: false
      - key: ODA_CONVERSION_TIMEOUT_SEC
        value: 30
